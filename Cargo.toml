[workspace]
resolver = "2"
members = [
    "benchmarking",
    "bits",
    "dao",
    "metrics",
    "utils",
]

[workspace.dependencies]
utils = { path = "utils" }
metrics = { path = "metrics" }
bits = { path = "bits" }
dao = { path = "dao" }

anndists = "0.1.2"
anyhow = "1.0.98"
bincode = "1.3.3"
bitvec_simd = "0.20.5"
byte-unit = { version = "5.1.6", default-features = false, features = [
    "byte",
    "rust_decimal",
] }
csv = "1.3.1"
deepsize = { version = "0.2.0", features = ["smallvec"] }
divan = "0.1.21"
hdf5 = { version = "0.10.1", package = "hdf5-metno", features = [
    "blosc",
    "static",
    "f16",
] }
log = "0.4.27"
ndarray = { version = "0.16.1", features = [
    "serde",
    "matrixmultiply-threading",
    "rayon",
    "deepsize",
] }
rand = "0.9.1"
rand_chacha = "0.9.0"
rand_distr = "0.5.1"
randperm-crt = "0.3.0"
rayon = "1.10.0"
serde = { version = "1.0.219", features = ["derive"] }
toml = "0.8.22"
tracing = "0.1.41"
wide = "0.7.32"
half = "2.7.1"

[patch.crates-io]
ndarray = { git = "https://github.com/fmckeogh/ndarray" }

[profile.release]
debug = false
strip = true

debug-assertions = false
overflow-checks = false
lto = "fat"
panic = 'abort'
incremental = false
codegen-units = 1
